environment:
  controlsocket:
    chmod: '0660'
    group: staff
  privdrop:
    group: halon
    user: halon
  rlimit:
    nofile: 70000
  umask: '0027'
  uuid:
    version: 4
plugins:
- config:
    default:
      bucket: halon
      profile: couchbase-database
    profiles:
    - connection_string: couchbase://couchbase
      id: couchbase-database
      password: password
      username: Administrator
    - certificate: /couchbase/couchbase-client.pem
      connection_string: couchbases://couchbase-tls
      id: couchbase-database-tls
      private_key: /couchbase/couchbase-client.key
      trust_store: /couchbase/couchbase-ca.pem
  id: couchbase
servers:
- id: default
  listeners:
  - address: 127.0.0.1
    port: 25
version: '5.8'
