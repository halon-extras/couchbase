version: "5.8"
servers:
  - id: default
    listeners:
      - port: 25
        address: 127.0.0.1
environment:
  uuid:
    version: 4
  controlsocket:
    group: staff
    chmod: "0660"
  privdrop:
    user: halon
    group: halon
  umask: "0027"
  rlimit:
    nofile: 70000
plugins:
  - id: couchbase
    config:
      default:
        profile: couchbase-database
        bucket: halon
      profiles:
        - id: couchbase-database
          connection_string: couchbase://couchbase
          username: Administrator
          password: password
